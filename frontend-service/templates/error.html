<!-- Generic error page used by 404/500 handlers and in-app error branches -->
{% extends "base.html" %}

{% block title %}Error - Grievance Management System{% endblock %}

{% block content %}
<div class="text-center py-5">
    <i class="fas fa-triangle-exclamation fa-4x mb-4" style="color: var(--danger-color);"></i>
    <h3 style="color: var(--primary-color);">Something went wrong</h3>
    <p class="text-muted">{{ error or 'An unexpected error occurred.' }}</p>
    <a href="{{ url_for('dashboard') if session.get('user_id') else url_for('login') }}" class="btn btn-primary mt-3">
        <i class="fas fa-house"></i> Go back
    </a>
</div>
{% endblock %}
