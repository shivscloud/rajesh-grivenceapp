# For local/dev use with `helm install`, values.yaml's defaults are fine.
# For anything real: never let real secret values sit in values.yaml in
# git. Instead run:
#   helm install rajeshapp . \
#     --set secrets.jwtSecret=$(openssl rand -hex 32) \
#     --set secrets.secretKey=$(openssl rand -hex 32) \
#     --set secrets.mongoPassword=<from-your-secret-manager>
# or point Helm at a values file that is itself pulled from a secret
# store at deploy time by your CI/CD pipeline (never committed).
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  SECRET_KEY: {{ .Values.secrets.secretKey | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  MONGO_ROOT_USERNAME: {{ .Values.secrets.mongoUser | quote }}
  MONGO_ROOT_PASSWORD: {{ .Values.secrets.mongoPassword | quote }}
  # urlquery percent-encodes the password so a literal "@" or ":" inside it
  # doesn't break MongoDB's connection-string parser — the same gotcha the
  # raw k8s/03-secret.yaml manifest called out and hand-encoded manually.
  MONGO_URI: "mongodb://{{ .Values.secrets.mongoUser }}:{{ .Values.secrets.mongoPassword | urlquery }}@mongo.{{ .Values.namespace }}.svc.cluster.local:27017/"
