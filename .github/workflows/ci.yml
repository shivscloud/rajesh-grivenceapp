name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:

  # 1. TEST
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - auth-service
          - grievance-service
          - audit-service
          - frontend-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: |
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Lint
        working-directory: ${{ matrix.service }}
        run: flake8 . --select=E9,F63,F7,F82

      - name: Test
        working-directory: ${{ matrix.service }}
        run: pytest --tb=short
        continue-on-error: true


  # 2. BUILD + PUSH + TRIVY
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest

    needs: test

    if: github.event_name == 'push'

    strategy:
      matrix:
        service:
          - auth-service
          - grievance-service
          - audit-service
          - frontend-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest

      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0


  # 3. HELM VALIDATION
  helm:
    name: Helm Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Helm Lint
        run: helm lint ./helm/rajeshapp

      - name: Helm Template
        run: |
          helm template rajeshapp ./helm/rajeshapp \
            --namespace rajeshapp
