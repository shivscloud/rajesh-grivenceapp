name: CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:

  # ============================================================
  # TEST AND LINT
  # ============================================================
  test-and-lint:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - grievance-service
          - audit-service
          - frontend-service

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Lint with flake8
        working-directory: ${{ matrix.service }}
        run: |
          flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

      - name: Check for pytest tests
        id: check-tests
        working-directory: ${{ matrix.service }}
        shell: bash
        run: |
          if find . -type f \( \
            -name "test_*.py" \
            -o -name "*_test.py" \
          \) | grep -q .; then
            echo "tests_found=true" >> "$GITHUB_OUTPUT"
            echo "Pytest tests found."
          else
            echo "tests_found=false" >> "$GITHUB_OUTPUT"
            echo "No pytest tests found. Pytest will be skipped."
          fi

      - name: Test with pytest
        if: steps.check-tests.outputs.tests_found == 'true'
        working-directory: ${{ matrix.service }}
        run: |
          python -m pytest --tb=short

      - name: No tests found
        if: steps.check-tests.outputs.tests_found == 'false'
        run: |
          echo "No pytest tests found for ${{ matrix.service }}."
          echo "Skipping pytest."


  # ============================================================
  # BUILD DOCKER IMAGES + TRIVY
  # ============================================================
  build-and-push:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest

    needs:
      - test-and-lint

    if: >
      github.event_name == 'push' &&
      (
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/master'
      )

    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - grievance-service
          - audit-service
          - frontend-service

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'


  # ============================================================
  # HELM VALIDATION
  # ============================================================
  helm-validate:
    name: Helm Validation
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.12.0'

      - name: Helm lint
        run: |
          helm lint ./helm/rajeshapp

      - name: Helm template
        run: |
          helm template test ./helm/rajeshapp \
            --namespace rajeshapp

      - name: Install kubeconform
        shell: bash
        run: |
          curl -L \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            -o kubeconform.tar.gz

          tar -xzf kubeconform.tar.gz

          sudo mv kubeconform /usr/local/bin/kubeconform

      - name: Kubeconform validation
        run: |
          helm template test ./helm/rajeshapp \
            --namespace rajeshapp \
            | kubeconform --strict --summary
