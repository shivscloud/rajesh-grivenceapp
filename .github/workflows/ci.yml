name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  SERVICES: "auth-service grievance-service audit-service frontend-service"

jobs:

  # -------------------------
  # TEST
  # -------------------------
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - grievance-service
          - audit-service
          - frontend-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Lint
        working-directory: ${{ matrix.service }}
        run: |
          flake8 . --select=E9,F63,F7,F82

      - name: Test
        working-directory: ${{ matrix.service }}
        run: |
          pytest --tb=short


  # -------------------------
  # BUILD + SCAN + PUSH
  # -------------------------
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest

    needs: test

    # Only build/push on normal pushes, not pull requests
    if: github.event_name == 'push'

    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - grievance-service
          - audit-service
          - frontend-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1


  # -------------------------
  # HELM VALIDATION
  # -------------------------
  helm:
    name: Helm Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Helm Lint
        run: |
          helm lint ./helm/rajeshapp

      - name: Helm Template
        run: |
          helm template rajeshapp ./helm/rajeshapp \
            --namespace rajeshapp
