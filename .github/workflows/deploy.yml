name: Deploy

on:
  workflow_run:
    workflows: ["Infrastructure"]
    types: [completed]
    branches: [main, master]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  EKS_CLUSTER_NAME: rajesh-grievanceapp-prod

jobs:
  check-infrastructure:
    name: Check Infrastructure status
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      should-proceed: ${{ steps.check.outputs.should-proceed }}
      ci-run-id: ${{ steps.find-ci.outputs.ci-run-id }}
    steps:
      - name: Verify Infrastructure success
        id: check
        run: echo "should-proceed=true" >> $GITHUB_OUTPUT

      - name: Find CI workflow run
        id: find-ci
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              branch: context.payload.workflow_run.head_branch,
              per_page: 5,
            });
            const latestSuccessful = runs.data.workflow_runs.find(r => r.conclusion === 'success');
            if (latestSuccessful) {
              core.setOutput('ci-run-id', latestSuccessful.id);
            }

  deploy:
    name: Deploy to Production
    needs: check-infrastructure
    if: needs.check-infrastructure.outputs.should-proceed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Download CI artifact
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: ${{ needs.check-infrastructure.outputs.ci-run-id }},
            });
            const matchArtifact = artifacts.data.artifacts.filter((artifact) => {
              return artifact.name == "image-meta"
            })[0];
            const download = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: matchArtifact.id,
              archive_format: 'zip',
            });
            const fs = require('fs');
            fs.writeFileSync('${{github.workspace}}/image-meta.zip', Buffer.from(download.data));

      - name: Extract artifact
        run: |
          unzip image-meta.zip
          IMAGE_TAG=$(cat image-tag.txt)
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Deploy with Helm
        run: |
          helm upgrade --install rajeshapp ./helm/rajeshapp \
            --set auth.image.repository=${{ secrets.DOCKERHUB_USERNAME }}/auth-service \
            --set auth.image.tag=${{ env.IMAGE_TAG }} \
            --set grievance.image.repository=${{ secrets.DOCKERHUB_USERNAME }}/grievance-service \
            --set grievance.image.tag=${{ env.IMAGE_TAG }} \
            --set audit.image.repository=${{ secrets.DOCKERHUB_USERNAME }}/audit-service \
            --set audit.image.tag=${{ env.IMAGE_TAG }} \
            --set frontend.image.repository=${{ secrets.DOCKERHUB_USERNAME }}/frontend-service \
            --set frontend.image.tag=${{ env.IMAGE_TAG }} \
            --wait --timeout=10m

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/auth-service -n rajeshapp --timeout=300s
          kubectl rollout status deployment/grievance-service -n rajeshapp --timeout=300s
          kubectl rollout status deployment/audit-service -n rajeshapp --timeout=300s
          kubectl rollout status deployment/frontend-service -n rajeshapp --timeout=300s