name: Deploy

on:
  workflow_run:
    workflows: ["Infrastructure"]
    types: [completed]
    branches: [main, master]

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy"
        required: true
        default: "latest"

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  IMAGE_TAG: latest

jobs:

  deploy:
    runs-on: ubuntu-latest
    environment: production

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:

      # ==========================================================
      # 1. Checkout repository
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}


      # ==========================================================
      # 2. Configure AWS credentials
      # ==========================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # ==========================================================
      # 3. Debug EC2
      # ==========================================================

      - name: Debug EC2 instances
        run: |
          aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=rajesh-grievanceapp-prod-kind" \
            --query "Reservations[].Instances[].{ID:InstanceId,State:State.Name,PublicIP:PublicIpAddress}" \
            --output table


      # ==========================================================
      # 4. Get EC2 public IP
      # ==========================================================

      - name: Get EC2 instance public IP
        id: ec2
        run: |

          set -e

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=rajesh-grievanceapp-prod-kind" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "❌ No running EC2 instance found"
            exit 1
          fi

          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)

          if [ -z "$PUBLIC_IP" ] || [ "$PUBLIC_IP" = "None" ]; then
            echo "❌ Instance has no public IP"
            exit 1
          fi

          echo "public_ip=$PUBLIC_IP" >> "$GITHUB_OUTPUT"

          echo "EC2 Instance : $INSTANCE_ID"
          echo "EC2 Public IP: $PUBLIC_IP"


      # ==========================================================
      # 5. Setup SSH key
      # ==========================================================

      - name: Setup SSH key
        run: |

          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > /tmp/ec2_key.pem

          chmod 600 /tmp/ec2_key.pem

          echo "SSH key configured"


      # ==========================================================
      # 6. Prepare EC2
      # ==========================================================

      - name: Prepare EC2
        run: |

          ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            -i /tmp/ec2_key.pem \
            ubuntu@${{ steps.ec2.outputs.public_ip }} << 'EOF'

            set -e

            echo "===================================="
            echo "Preparing EC2"
            echo "===================================="

            sudo mkdir -p /opt/rajesh-grievanceapp

            sudo chown -R ubuntu:ubuntu \
              /opt/rajesh-grievanceapp

            echo ""
            echo "Docker:"
            docker --version

            echo ""
            echo "Kind:"
            kind --version

            echo ""
            echo "Kubectl:"
            kubectl version --client

            echo ""
            echo "Helm:"
            helm version

            echo ""
            echo "===================================="
            echo "EC2 ready"
            echo "===================================="

          EOF


      # ==========================================================
      # 7. Copy Helm chart
      # ==========================================================

      - name: Copy Helm chart to EC2
        run: |

          scp \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            -i /tmp/ec2_key.pem \
            -r ./helm/rajeshapp \
            ubuntu@${{ steps.ec2.outputs.public_ip }}:/opt/rajesh-grievanceapp/


      # ==========================================================
      # 8. Deploy to EC2 Kind
      # ==========================================================

      - name: Deploy to EC2 Kind
        run: |

          IMAGE_TAG="${{ github.event.inputs.image_tag || env.IMAGE_TAG }}"

          ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            -i /tmp/ec2_key.pem \
            ubuntu@${{ steps.ec2.outputs.public_ip }} << EOF

            set -e

            IMAGE_TAG="$IMAGE_TAG"
            DOCKER_USER="${{ secrets.DOCKERHUB_USERNAME }}"

            echo "===================================="
            echo "Deployment"
            echo "===================================="

            echo "Image tag : \$IMAGE_TAG"
            echo "Docker user: \$DOCKER_USER"

            # ==================================================
            # Ensure Kind cluster exists
            # ==================================================

            if ! kind get clusters | grep -q "^rajesh-kind\$"; then

              echo "Creating Kind cluster..."

              cat > /tmp/kind-config.yaml << 'KIND_EOF'
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
KIND_EOF

              kind create cluster \
                --name rajesh-kind \
                --config /tmp/kind-config.yaml

            else

              echo "Kind cluster already exists"

            fi


            # ==================================================
            # Verify Kind
            # ==================================================

            echo ""
            echo "===================================="
            echo "Kind cluster"
            echo "===================================="

            kind get clusters

            echo ""
            echo "Docker port mapping:"
            docker ps \
              --format 'table {{.Names}}\t{{.Ports}}'

            echo ""
            echo "Kubernetes nodes:"
            kubectl get nodes -o wide


            # ==================================================
            # Docker Hub login
            # ==================================================

            echo ""
            echo "===================================="
            echo "Docker Hub Login"
            echo "===================================="

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
              docker login \
                -u "\$DOCKER_USER" \
                --password-stdin


            # ==================================================
            # Pull and load images
            # ==================================================

            for svc in \
              auth-service \
              grievance-service \
              audit-service \
              frontend-service
            do

              echo ""
              echo "------------------------------------"
              echo "Deploying \$svc"
              echo "------------------------------------"

              docker pull \
                "\$DOCKER_USER/\$svc:\$IMAGE_TAG"

              kind load docker-image \
                "\$DOCKER_USER/\$svc:\$IMAGE_TAG" \
                --name rajesh-kind

            done


            # ==================================================
            # Helm deployment
            # ==================================================

            cd /opt/rajesh-grievanceapp

            echo ""
            echo "===================================="
            echo "Helm deployment"
            echo "===================================="

            helm upgrade --install rajeshapp \
              ./rajeshapp \
              --namespace rajesh \
              --create-namespace \
              --set image.registry="\$DOCKER_USER" \
              --set image.tag="\$IMAGE_TAG" \
              --set service.type=NodePort \
              --set service.nodePort=30080 \
              --wait \
              --timeout=10m


            echo ""
            echo "===================================="
            echo "Helm deployment completed"
            echo "===================================="

          EOF


      # ==========================================================
      # 9. Verify deployment
      # ==========================================================

      - name: Verify deployment
        run: |

          ssh \
            -o StrictHostKeyChecking=no \
            -i /tmp/ec2_key.pem \
            ubuntu@${{ steps.ec2.outputs.public_ip }} << 'EOF'

            set -e

            echo "===================================="
            echo "PODS"
            echo "===================================="

            kubectl get pods \
              -n rajesh \
              -o wide


            echo ""
            echo "===================================="
            echo "SERVICES"
            echo "===================================="

            kubectl get svc \
              -n rajesh


            echo ""
            echo "===================================="
            echo "DEPLOYMENTS"
            echo "===================================="

            kubectl get deployments \
              -n rajesh


            echo ""
            echo "===================================="
            echo "STATEFULSETS"
            echo "===================================="

            kubectl get statefulsets \
              -n rajesh


            echo ""
            echo "===================================="
            echo "HPA"
            echo "===================================="

            kubectl get hpa \
              -n rajesh \
              || true


            echo ""
            echo "===================================="
            echo "HELM"
            echo "===================================="

            helm list \
              -n rajesh


            echo ""
            echo "===================================="
            echo "KIND PORT MAPPING"
            echo "===================================="

            docker ps \
              --format 'table {{.Names}}\t{{.Ports}}'


            echo ""
            echo "===================================="
            echo "APPLICATION TEST"
            echo "===================================="

            curl \
              --connect-timeout 10 \
              --max-time 30 \
              -f \
              http://localhost:30080

            echo ""
            echo "===================================="
            echo "✅ APPLICATION ACCESSIBLE"
            echo "===================================="

          EOF


      # ==========================================================
      # 10. Cleanup SSH key
      # ==========================================================

      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f /tmp/ec2_key.pem
