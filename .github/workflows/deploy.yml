name: Deploy

on:
  workflow_run:
    workflows:
      - Infrastructure
    types:
      - completed
    branches:
      - main
      - master

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy"
        required: true
        type: string
        default: "latest"

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  IMAGE_TAG: latest

jobs:

  deploy:
    name: Deploy to EC2 Kind
    runs-on: ubuntu-latest
    environment: production

    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success'
      )

    steps:

      # ============================================================
      # 1. Checkout repository
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}


      # ============================================================
      # 2. Configure AWS
      # ============================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # ============================================================
      # 3. Find EC2
      # ============================================================

      - name: Get EC2 public IP
        id: ec2
        shell: bash
        run: |

          set -e

          echo "======================================"
          echo "Finding production EC2"
          echo "======================================"

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=rajesh-grievanceapp-prod-kind" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "❌ No running EC2 instance found"
            exit 1
          fi

          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)

          if [ -z "$PUBLIC_IP" ] || [ "$PUBLIC_IP" = "None" ]; then
            echo "❌ EC2 has no public IP"
            exit 1
          fi

          echo "public_ip=$PUBLIC_IP" >> "$GITHUB_OUTPUT"

          echo "Instance ID : $INSTANCE_ID"
          echo "Public IP   : $PUBLIC_IP"


      # ============================================================
      # 4. Setup SSH
      # ============================================================

      - name: Setup SSH key
        run: |

          set -e

          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > /tmp/ec2_key.pem

          chmod 600 /tmp/ec2_key.pem

          echo "SSH key ready"


      # ============================================================
      # 5. Prepare EC2
      # ============================================================

      - name: Prepare EC2
        run: |

          ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            -i /tmp/ec2_key.pem \
            ubuntu@${{ steps.ec2.outputs.public_ip }} << 'EOF'

            set -e

            echo "======================================"
            echo "Preparing EC2"
            echo "======================================"

            sudo mkdir -p /opt/rajesh-grievanceapp

            sudo chown -R ubuntu:ubuntu \
              /opt/rajesh-grievanceapp

            echo ""
            echo "Docker:"
            docker --version

            echo ""
            echo "Kind:"
            kind --version

            echo ""
            echo "Kubectl:"
            kubectl version --client

            echo ""
            echo "Helm:"
            helm version

            echo ""
            echo "======================================"
            echo "EC2 READY"
            echo "======================================"

          EOF


      # ============================================================
      # 6. Copy Helm chart
      # ============================================================

      - name: Copy Helm chart
        run: |

          set -e

          scp \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            -i /tmp/ec2_key.pem \
            -r ./helm/rajeshapp \
            ubuntu@${{ steps.ec2.outputs.public_ip }}:/opt/rajesh-grievanceapp/

          echo "Helm chart copied"


      # ============================================================
      # 7. Deploy
      # ============================================================

      - name: Deploy to EC2 Kind
        run: |

          set -e

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            IMAGE_TAG="${{ inputs.image_tag }}"
          else
            IMAGE_TAG="${{ env.IMAGE_TAG }}"
          fi

          echo "Deploying image tag: $IMAGE_TAG"

          ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            -i /tmp/ec2_key.pem \
            ubuntu@${{ steps.ec2.outputs.public_ip }} << EOF

            set -e

            IMAGE_TAG="$IMAGE_TAG"
            DOCKER_USER="${{ secrets.DOCKERHUB_USERNAME }}"

            echo "======================================"
            echo "DEPLOYMENT"
            echo "======================================"

            echo "Docker user : \$DOCKER_USER"
            echo "Image tag   : \$IMAGE_TAG"


            # ==================================================
            # Create Kind cluster with EC2 port mapping
            # ==================================================

            if ! kind get clusters | grep -q "^rajesh-kind\$"; then

              echo ""
              echo "Creating Kind cluster..."

              cat > /tmp/kind-config.yaml << 'KIND_EOF'
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
KIND_EOF

              cat /tmp/kind-config.yaml

              kind create cluster \
                --name rajesh-kind \
                --config /tmp/kind-config.yaml

            else

              echo "Kind cluster already exists"

            fi


            # ==================================================
            # Verify cluster
            # ==================================================

            echo ""
            echo "======================================"
            echo "KIND CLUSTER"
            echo "======================================"

            kind get clusters

            echo ""
            docker ps \
              --format 'table {{.Names}}\t{{.Ports}}'

            echo ""
            kubectl get nodes -o wide


            # ==================================================
            # Docker Hub login
            # ==================================================

            echo ""
            echo "======================================"
            echo "DOCKER HUB LOGIN"
            echo "======================================"

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
              docker login \
                -u "\$DOCKER_USER" \
                --password-stdin


            # ==================================================
            # Pull and load images
            # ==================================================

            for svc in \
              auth-service \
              grievance-service \
              audit-service \
              frontend-service
            do

              echo ""
              echo "--------------------------------------"
              echo "Deploying \$svc"
              echo "--------------------------------------"

              IMAGE="\$DOCKER_USER/\$svc:\$IMAGE_TAG"

              docker pull "\$IMAGE"

              kind load docker-image \
                "\$IMAGE" \
                --name rajesh-kind

            done


            # ==================================================
            # Helm
            # ==================================================

            cd /opt/rajesh-grievanceapp

            echo ""
            echo "======================================"
            echo "HELM DEPLOYMENT"
            echo "======================================"

            helm upgrade --install rajeshapp \
              ./rajeshapp \
              --namespace rajesh \
              --create-namespace \
              --set image.registry="\$DOCKER_USER" \
              --set image.tag="\$IMAGE_TAG" \
              --set service.type=NodePort \
              --set service.nodePort=30080 \
              --wait \
              --timeout=10m


            # ==================================================
            # Verify
            # ==================================================

            echo ""
            echo "======================================"
            echo "PODS"
            echo "======================================"

            kubectl get pods -n rajesh -o wide

            echo ""
            echo "======================================"
            echo "SERVICES"
            echo "======================================"

            kubectl get svc -n rajesh


            # ==================================================
            # Test application
            # ==================================================

            echo ""
            echo "======================================"
            echo "TESTING APPLICATION"
            echo "======================================"

            sleep 5

            curl \
              --connect-timeout 10 \
              --max-time 30 \
              -f \
              http://localhost:30080

            echo ""
            echo "======================================"
            echo "✅ APPLICATION IS ACCESSIBLE"
            echo "======================================"

          EOF


      # ============================================================
      # 8. Final verification
      # ============================================================

      - name: Verify deployment
        run: |

          ssh \
            -o StrictHostKeyChecking=no \
            -i /tmp/ec2_key.pem \
            ubuntu@${{ steps.ec2.outputs.public_ip }} << 'EOF'

            set -e

            echo "======================================"
            echo "FINAL VERIFICATION"
            echo "======================================"

            echo ""
            echo "PODS"
            kubectl get pods -n rajesh

            echo ""
            echo "SERVICES"
            kubectl get svc -n rajesh

            echo ""
            echo "DEPLOYMENTS"
            kubectl get deployments -n rajesh

            echo ""
            echo "STATEFULSETS"
            kubectl get statefulsets -n rajesh

            echo ""
            echo "HPA"
            kubectl get hpa -n rajesh || true

            echo ""
            echo "HELM"
            helm list -n rajesh

            echo ""
            echo "PORT MAPPING"
            docker ps --format 'table {{.Names}}\t{{.Ports}}'

            echo ""
            echo "======================================"
            echo "✅ DEPLOYMENT SUCCESSFUL"
            echo "======================================"

          EOF


      # ============================================================
      # 9. Cleanup
      # ============================================================

      - name: Cleanup SSH key
        if: always()
        run: |

          rm -f /tmp/ec2_key.pem

          echo "SSH key removed"
