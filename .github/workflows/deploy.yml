name: Deploy

on:
  workflow_run:
    workflows: ["Infrastructure"]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:  

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get EC2 instance public IP
        id: ec2
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=rajesh-grievanceapp-prod-ec2-kind-host" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)
          PUBLIC_IP=$(aws ec2 describe-instances --instance-ids $INSTANCE_ID \
            --query "Reservations[0].Instances[0].PublicIpAddress" --output text)
          echo "public_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT

      - name: Setup SSH key
        run: |
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > /tmp/ec2_key.pem
          chmod 600 /tmp/ec2_key.pem

      - name: Deploy to EC2 kind cluster
        run: |
          ssh -o StrictHostKeyChecking=no -i /tmp/ec2_key.pem ec2-user@${{ steps.ec2.outputs.public_ip }} << 'EOF'
            set -e
            cd /opt/rajesh-grievanceapp

            # Pull latest images (replace IMAGE_TAG with your CI artifact or manual input)
            for svc in auth-service grievance-service audit-service frontend-service; do
              docker pull ${{ secrets.DOCKERHUB_USERNAME }}/$svc:${{ env.IMAGE_TAG }}
              kind load docker-image ${{ secrets.DOCKERHUB_USERNAME }}/$svc:${{ env.IMAGE_TAG }} --name rajesh-kind
            done

            # Helm deploy
            helm upgrade --install rajeshapp ./helm/rajeshapp \
              --namespace rajesh \
              --create-namespace \
              --set image.registry=${{ secrets.DOCKERHUB_USERNAME }} \
              --set image.tag=${{ env.IMAGE_TAG }} \
              --set service.type=NodePort \
              --set service.nodePort=30080 \
              --wait --timeout=10m
          EOF

      - name: Verify deployment
        run: |
          ssh -o StrictHostKeyChecking=no -i /tmp/ec2_key.pem ec2-user@${{ steps.ec2.outputs.public_ip }} << 'EOF'
            kubectl get pods -n rajesh
            kubectl get svc -n rajesh
          EOF

      - name: Cleanup SSH key
        if: always()
        run: rm -f /tmp/ec2_key.pem
