name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-west-2
  EKS_CLUSTER_NAME: rajesh-grievanceapp-prod
  DOCKER_REGISTRY: docker.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-service, grievance-service, audit-service, frontend-service]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Deploy with Helm
        run: |
          helm upgrade --install rajeshapp ./helm/rajeshapp \
            --set auth.image.repository=${{ secrets.DOCKERHUB_USERNAME }}/auth-service \
            --set auth.image.tag=${{ github.sha }} \
            --set grievance.image.repository=${{ secrets.DOCKERHUB_USERNAME }}/grievance-service \
            --set grievance.image.tag=${{ github.sha }} \
            --set audit.image.repository=${{ secrets.DOCKERHUB_USERNAME }}/audit-service \
            --set audit.image.tag=${{ github.sha }} \
            --set frontend.image.repository=${{ secrets.DOCKERHUB_USERNAME }}/frontend-service \
            --set frontend.image.tag=${{ github.sha }} \
            --wait --timeout=10m

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/auth-service -n rajeshapp --timeout=300s
          kubectl rollout status deployment/grievance-service -n rajeshapp --timeout=300s
          kubectl rollout status deployment/audit-service -n rajeshapp --timeout=300s
          kubectl rollout status deployment/frontend-service -n rajeshapp --timeout=300s