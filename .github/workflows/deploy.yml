name: Deploy

on:
  workflow_run:
    workflows: ["Infrastructure"]
    types: [completed]
    branches: [main, master]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  check-infrastructure:
    name: Check Infrastructure status
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      should-proceed: ${{ steps.check.outputs.should-proceed }}
      ci-run-id: ${{ steps.find-ci.outputs.ci-run-id }}
    steps:
      - name: Verify Infrastructure success
        id: check
        run: echo "should-proceed=true" >> $GITHUB_OUTPUT

      - name: Find CI workflow run
        id: find-ci
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              branch: context.payload.workflow_run.head_branch,
              per_page: 5,
            });
            const latestSuccessful = runs.data.workflow_runs.find(r => r.conclusion === 'success');
            if (latestSuccessful) {
              core.setOutput('ci-run-id', latestSuccessful.id);
            }

  deploy:
    name: Deploy to EC2 (kind)
    needs: check-infrastructure
    if: needs.check-infrastructure.outputs.should-proceed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Download CI artifact
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: ${{ needs.check-infrastructure.outputs.ci-run-id }},
            });
            const matchArtifact = artifacts.data.artifacts.filter((artifact) => {
              return artifact.name == "image-meta"
            })[0];
            const download = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: matchArtifact.id,
              archive_format: 'zip',
            });
            const fs = require('fs');
            fs.writeFileSync('${{github.workspace}}/image-meta.zip', Buffer.from(download.data));

      - name: Extract artifact
        run: |
          unzip image-meta.zip
          IMAGE_TAG=$(cat image-tag.txt)
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get EC2 instance public IP
        id: ec2
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=rajesh-grievanceapp-prod-ec2-kind-host" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)
          PUBLIC_IP=$(aws ec2 describe-instances --instance-ids $INSTANCE_ID \
            --query "Reservations[0].Instances[0].PublicIpAddress" --output text)
          echo "public_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT

      - name: Setup SSH key
        run: |
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > /tmp/ec2_key.pem
          chmod 600 /tmp/ec2_key.pem

      - name: Deploy to EC2 kind cluster
        run: |
          ssh -o StrictHostKeyChecking=no -i /tmp/ec2_key.pem ec2-user@${{ steps.ec2.outputs.public_ip }} << 'EOF'
            set -e
            cd /opt/rajesh-grievanceapp

            # Pull latest images from Docker Hub using CI tag
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/auth-service:${{ env.IMAGE_TAG }}
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/grievance-service:${{ env.IMAGE_TAG }}
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/audit-service:${{ env.IMAGE_TAG }}
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/frontend-service:${{ env.IMAGE_TAG }}

            # Load images into kind cluster
            kind load docker-image ${{ secrets.DOCKERHUB_USERNAME }}/auth-service:${{ env.IMAGE_TAG }} --name rajesh-kind
            kind load docker-image ${{ secrets.DOCKERHUB_USERNAME }}/grievance-service:${{ env.IMAGE_TAG }} --name rajesh-kind
            kind load docker-image ${{ secrets.DOCKERHUB_USERNAME }}/audit-service:${{ env.IMAGE_TAG }} --name rajesh-kind
            kind load docker-image ${{ secrets.DOCKERHUB_USERNAME }}/frontend-service:${{ env.IMAGE_TAG }} --name rajesh-kind

            # Deploy/upgrade with Helm using CI image tag
            helm upgrade --install rajeshapp ./helm/rajeshapp \
              --namespace rajesh \
              --create-namespace \
              --set image.registry=${{ secrets.DOCKERHUB_USERNAME }} \
              --set image.tag=${{ env.IMAGE_TAG }} \
              --set service.type=NodePort \
              --set service.nodePort=30080 \
              --wait --timeout=10m

            echo "Deployment complete"
          EOF

      - name: Verify deployment
        run: |
          ssh -o StrictHostKeyChecking=no -i /tmp/ec2_key.pem ec2-user@${{ steps.ec2.outputs.public_ip }} << 'EOF'
            kubectl get pods -n rajesh
            kubectl get svc -n rajesh
            echo ""
            echo "Application accessible at: http://$(curl -s http://169.254.169.254/latest/meta-data/public-ipv4):8080"
          EOF

      - name: Cleanup SSH key
        if: always()
        run: rm -f /tmp/ec2_key.pem