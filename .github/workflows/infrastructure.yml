name: Infrastructure (Lint but no fail to find)

on:
  # Direct trigger: when you edit this workflow file itself v
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '.github/workflows/infrastructure.yml'  
      - 'terraform/**'  
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/infrastructure.yml'
      - 'terraform/**'

  # Execute after CI succeeds
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - master
    

permissions:
  contents: read
  security-events: write   # needed for SARIF upload

env:
  AWS_REGION: us-east-1
  TF_VERSION: ${{ vars.TF_VERSION || '1.5.0' }}
  WORKING_DIR: ${{ vars.WORKING_DIR || './terraform/environments/prod' }}

jobs:
  # ------------------------------------------------
  # Decide if we should proceed to go
  # ------------------------------------------------
  check-ci:
    name: Check CI status or direct push
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    outputs:
      should-proceed: ${{ steps.check.outputs.should-proceed }}
    steps:
      - name: Determine if we should proceed
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "should-proceed=true" >> $GITHUB_OUTPUT
          else
            # workflow_run – we already filtered by success
            echo "should-proceed=true" >> $GITHUB_OUTPUT
          fi

  # ------------------------------------------------
  # Lint & Security Scan (non‑blocking)
  # ------------------------------------------------
  lint:
    name: Lint & Security Scan (non‑blocking)
    needs: check-ci
    if: needs.check-ci.outputs.should-proceed == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true   # ⬅️ never blocks the pipeline

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Run TFLint (non‑failing)
        run: |
          cd ${{ env.WORKING_DIR }}
          tflint --init
          tflint --recursive || true   # ignore exit code

      - name: Run Checkov (SARIF) – non‑blocking
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ${{ env.WORKING_DIR }}
          framework: terraform
          output_format: sarif
          output_file_path: ${{ env.WORKING_DIR }}/results.sarif
          soft_fail: true

      - name: Upload Checkov SARIF (if file exists)
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles(format('{0}/results.sarif', env.WORKING_DIR)) != ''
        with:
          sarif_file: ${{ env.WORKING_DIR }}/results.sarif

      - name: Run OPA/Nag scan – non‑blocking
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ${{ env.WORKING_DIR }}
          framework: terraform_plan
          check: CKV_AWS_1,CKV_AWS_2,CKV_AWS_3
          soft_fail: true

  # ------------------------------------------------
  # Terraform Apply (uses access keys, not OIDC)
  # ------------------------------------------------
  terraform:
    name: Terraform Apply
    needs: [check-ci, lint]
    if: needs.check-ci.outputs.should-proceed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - name: Configure AWS credentials (using access keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          cd ${{ env.WORKING_DIR }}
          terraform init -input=false -reconfigure 


      - name: Terraform Validate
        run: |
          cd ${{ env.WORKING_DIR }}
          terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          cd ${{ env.WORKING_DIR }}
          terraform plan -out=tfplan

      - name: Terraform Apply
        run: |
          cd ${{ env.WORKING_DIR }}
          terraform apply -auto-approve tfplan