name: Infrastructure

on:
  # ONLY infrastructure.yml change
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/infrastructure.yml'

  # Run after CI completes
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
      - master

permissions:
  contents: read
  security-events: write

env:
  AWS_REGION: us-east-1
  TF_VERSION: ${{ vars.TF_VERSION || '1.5.0' }}
  WORKING_DIR: ${{ vars.WORKING_DIR || './terraform' }}

jobs:

  check:
    name: Check trigger
    runs-on: ubuntu-latest

    outputs:
      run-infra: ${{ steps.check.outputs.run-infra }}

    steps:
      - name: Check event
        id: check
        run: |
          echo "Event: ${{ github.event_name }}"

          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "Direct infrastructure change"
            echo "run-infra=true" >> "$GITHUB_OUTPUT"

          elif [[ "${{ github.event_name }}" == "workflow_run" &&
                  "${{ github.event.workflow_run.conclusion }}" == "success" ]]; then
            echo "CI completed successfully"
            echo "run-infra=true" >> "$GITHUB_OUTPUT"

          else
            echo "Infrastructure will not run"
            echo "run-infra=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Terraform Lint & Security
    needs: check
    if: needs.check.outputs.run-infra == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: TFLint
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          tflint --init
          tflint --recursive || true

      - name: Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ${{ env.WORKING_DIR }}
          framework: terraform
          output_format: sarif
          output_file_path: ${{ env.WORKING_DIR }}/results.sarif
          soft_fail: true

      - name: Upload Checkov SARIF
        if: always() && hashFiles(format('{0}/results.sarif', env.WORKING_DIR)) != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ env.WORKING_DIR }}/results.sarif

  terraform:
    name: Terraform Apply
    needs: [check, lint]
    if: needs.check.outputs.run-infra == 'true'
    runs-on: ubuntu-latest

    steps:

      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init

      - name: Terraform Validate
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform apply -auto-approve tfplan