name: Infrastructure (Lint but no fail)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, master]

permissions:
  id-token: write
  contents: read
  security-events: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
  TF_VERSION: ${{ vars.TF_VERSION || '1.5.0' }}
  WORKING_DIR: ${{ vars.WORKING_DIR || './terraform' }}

jobs:
  check-ci:
    name: Check CI status
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      should-proceed: ${{ steps.check.outputs.should-proceed }}
    steps:
      - run: echo "should-proceed=true" >> $GITHUB_OUTPUT
        id: check

  lint:
    name: Lint & Security Scan (non‑blocking)
    needs: check-ci
    if: needs.check-ci.outputs.should-proceed == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true   # ⬅️ this keeps the job from failing

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Run TFLint (non‑failing)
        run: |
          cd ${{ env.WORKING_DIR }}
          tflint --init
          tflint --recursive || true   # ignore exit code

      - name: Run Checkov (SARIF) – non‑blocking
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ${{ env.WORKING_DIR }}
          framework: terraform
          output_format: sarif
          output_file_path: ${{ env.WORKING_DIR }}/results.sarif
          soft_fail: true

      - name: Upload Checkov SARIF (if file exists)
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles(format('{0}/results.sarif', env.WORKING_DIR)) != ''
        with:
          sarif_file: ${{ env.WORKING_DIR }}/results.sarif

      - name: Run OPA/Nag scan – non‑blocking
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ${{ env.WORKING_DIR }}
          framework: terraform_plan
          check: CKV_AWS_1,CKV_AWS_2,CKV_AWS_3
          soft_fail: true

  terraform:
    name: Terraform Apply
    needs: [check-ci, lint]
    if: needs.check-ci.outputs.should-proceed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          cd ${{ env.WORKING_DIR }}
          terraform init

      - name: Terraform Validate
        run: |
          cd ${{ env.WORKING_DIR }}
          terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          cd ${{ env.WORKING_DIR }}
          terraform plan -out=tfplan

      - name: Terraform Apply
        run: |
          cd ${{ env.WORKING_DIR }}
          terraform apply -auto-approve tfplan